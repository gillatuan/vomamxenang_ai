name: Update approved Day 2 article media
on:
  push:
    branches: [ops/update-day2-full-media]
    paths:
      - backend/scripts/media-update/**
      - backend/test/media-update/**
      - .github/workflows/update-day2-full-media.yml
permissions:
  contents: read
concurrency:
  group: production-content-day2
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    environment: Production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test single article update boundaries
        run: node --test test/media-update/update-day2.test.cjs
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Wait for deployed media with exact byte verification
        run: |
          for attempt in {1..30}; do
            if node scripts/media-update/update-day2.cjs --verify-media-only; then
              exit 0
            fi
            echo "Waiting for approved media deployment (attempt $attempt/30)"
            sleep 20
          done
          exit 1
      - name: Verify deployed media and read-only article preflight
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          CONFIRMATION: UPDATE-DAY2-FULL-MEDIA
        run: node scripts/media-update/update-day2.cjs --dry-run
      - name: Update and verify only the approved article content
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          CONFIRMATION: UPDATE-DAY2-FULL-MEDIA
        run: node scripts/media-update/update-day2.cjs

name: Private encrypted production backup (prepared)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Explicitly approve encrypted-only transit artifact and private durable retention
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-encrypted-backup
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.confirmation == 'SAVE-ENCRYPTED-BACKUP' }}
    name: Read-only production backup and isolated restore
    runs-on: ubuntu-24.04
    environment: Production
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed recovery public key
        run: test -s backup-recipient-public.pem
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test safe connection diagnostics
        run: node --test test/db-audit-backup.test.cjs
      - name: Install PostgreSQL clients
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          pgdg_codename="$(lsb_release -cs)"
          printf '%s\n' "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${pgdg_codename}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Verify production backup and isolated restore
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_MODE: production-only
          BACKUP_DIR: ${{ runner.temp }}/private-backups
          TEMP_RESTORE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEMP_RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vmx_restore_verify
          AUDITED_SHA: ${{ github.sha }}
        run: bash scripts/db-audit-backup.sh
      - name: Encrypt verified archive before any upload
        shell: bash
        run: |
          set -euo pipefail
          backup_marker="$(find "$RUNNER_TEMP/private-backups" -name verified.json -print -quit)"
          test -n "$backup_marker"
          backup_directory="$(dirname "$backup_marker")"
          tar -C "$backup_directory" -cf "$RUNNER_TEMP/production-backup.tar" .
          node scripts/backup-envelope.cjs encrypt "$RUNNER_TEMP/production-backup.tar" "$RUNNER_TEMP/production-backup.vmxenc" backup-recipient-public.pem
          (cd "$RUNNER_TEMP" && sha256sum production-backup.vmxenc > production-backup.vmxenc.sha256)
      - name: Upload encrypted-only transit artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-production-backup
          path: |
            ${{ runner.temp }}/production-backup.vmxenc
            ${{ runner.temp }}/production-backup.vmxenc.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Remove plaintext temporary backup
        if: always()
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          rm -f "$RUNNER_TEMP/production-backup.tar"
          rm -rf "$RUNNER_TEMP/private-backups"

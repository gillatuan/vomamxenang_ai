name: Production migration preflight

on:
  workflow_dispatch:
    inputs:
      migration_ref:
        description: Git ref whose Prisma migrations/schema should be checked
        required: true
        default: feature/p2-1-stock-lifecycle
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only production migration preflight
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.migration_ref }}
      - name: Report audited revision
        run: echo "Auditing ref=${{ inputs.migration_ref }} sha=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Require dedicated migration credential
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Production secret PRODUCTION_MIGRATION_DATABASE_URL is not configured."
            exit 1
          fi
      - name: Validate Prisma schema
        run: yarn prisma validate
      - name: Inspect production migration status (read only)
        id: migration_status
        shell: bash
        run: |
          set +e
          output="$(./node_modules/.bin/prisma migrate status 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          # Pending migrations and the one audited legacy database-only migration are expected.
          # Connection errors, failed migrations, and any other database-only migration remain unsafe.
          sanitized="$(printf '%s\\n' "$output" | grep -v '20261004130000_product_category_relation' || true)"
          if printf '%s' "$sanitized" | grep -Eqi 'P100[0-9]|P300[0-9]|failed migration|permission denied|authentication failed|connect'; then
            echo "::warning::Production migration history/connection requires review; continuing read-only audits."
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$sanitized" | grep -Eqi 'migrations from the database are not found locally:'; then
            echo "::warning::Unknown database-only migration detected."
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ] && ! printf '%s' "$output" | grep -Eqi 'following migration.*not yet been applied|migrations have not yet been applied|pending'; then
            echo "::warning::Unexpected prisma migrate status failure; continuing read-only audits."
            echo "unsafe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
      - name: Audit product-category migration alias
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const crypto = require('crypto');
          const fs = require('fs');
          const prisma = new PrismaClient();
          (async () => {
            const rows = await prisma.$queryRawUnsafe(
              `SELECT migration_name, checksum, finished_at, rolled_back_at, logs
                 FROM "_prisma_migrations"
                WHERE migration_name IN ('20261004130000_product_category_relation','20261004140000_product_category_relation')
                ORDER BY migration_name`
            );
            const sql = fs.readFileSync('prisma/migrations/20261004140000_product_category_relation/migration.sql','utf8');
            const localChecksum = crypto.createHash('sha256').update(sql).digest('hex');
            console.log('Local 140000 checksum:', localChecksum);
            for (const row of rows) {
              console.log({
                migration_name: row.migration_name,
                checksum: row.checksum,
                finished: Boolean(row.finished_at),
                rolled_back: Boolean(row.rolled_back_at),
                has_logs: Boolean(row.logs),
                checksum_matches_local_140000: row.checksum === localChecksum,
              });
            }
          })().finally(() => prisma.$disconnect());
          NODE

      - name: Audit legacy 130000 database effects
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const row = await prisma.$queryRawUnsafe(`
              SELECT migration_name, started_at, finished_at, rolled_back_at, applied_steps_count, checksum, logs
              FROM "_prisma_migrations"
              WHERE migration_name = '20261004130000_product_category_relation'
              ORDER BY started_at
            `);
            const column = await prisma.$queryRawUnsafe(`
              SELECT column_name, data_type, is_nullable
              FROM information_schema.columns
              WHERE table_schema='public' AND table_name='Product' AND column_name='categoryId'
            `);
            const indexes = await prisma.$queryRawUnsafe(`
              SELECT indexname, indexdef FROM pg_indexes
              WHERE schemaname='public' AND tablename='Product' AND indexname='Product_categoryId_idx'
            `);
            const fk = await prisma.$queryRawUnsafe(`
              SELECT conname, pg_get_constraintdef(oid) AS definition
              FROM pg_constraint
              WHERE conname='Product_categoryId_fkey'
            `);
            console.log('Legacy 130000 ledger:', row);
            console.log('Current categoryId column:', column);
            console.log('Current category index:', indexes);
            console.log('Current category FK:', fk);
            const ok = row.length === 1 && row[0].checksum === '43e5e770f5d30fa626c7a0447f12e88588e50b0593512fb474bc91e5c335e36a' && Boolean(row[0].finished_at) && !row[0].rolled_back_at && Number(row[0].applied_steps_count) === 1 && column.length === 1 && indexes.length === 1 && fk.length === 1;
            if (!ok) throw new Error('Legacy 130000 verification failed');
            console.log('Legacy 130000 verification: PASS');
          })().finally(() => prisma.$disconnect());
          NODE

      - name: Verify production migration ledger is readable
        run: |
          node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const rows = await prisma.$queryRawUnsafe(
              'SELECT migration_name, finished_at, rolled_back_at FROM "_prisma_migrations" ORDER BY started_at'
            );
            const failed = rows.filter(r => !r.finished_at && !r.rolled_back_at);
            console.log(`Applied migration ledger entries: ${rows.length}`);
            if (failed.length) {
              console.error('Unresolved migration entries:', failed.map(r => r.migration_name).join(', '));
              process.exitCode = 1;
            }
          })().finally(() => prisma.$disconnect());
          NODE

      - name: Fail preflight after read-only audits
        if: always() && steps.migration_status.outputs.unsafe == 'true'
        run: |
          echo "::error::Production migration history is not safe for migrate deploy. Review the read-only audit output above."
          exit 1

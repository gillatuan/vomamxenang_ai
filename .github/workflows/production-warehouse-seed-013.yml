name: Production warehouse diary seed 013

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preview or protected production apply
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run
      expected_database_name:
        description: Required for apply only; leave blank during dry-run to detect database name
        required: false
        type: string
      confirmation:
        description: For apply, type APPLY-SEED-013-PRODUCTION
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-seed-013
  cancel-in-progress: false

jobs:
  dry-run:
    name: Read-only seed 013 preview
    if: ${{ inputs.mode == 'dry-run' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      EXPECTED_PRODUCTION_DATABASE_NAME: ${{ inputs.expected_database_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable && yarn install --frozen-lockfile
      - name: Preview only seed 013
        run: yarn ts-node --transpile-only scripts/seed-warehouse-day4-day5.ts dry-run

  apply:
    name: Use separate hosted backup and protected apply workflows
    if: ${{ inputs.mode == 'apply' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Explain new protected apply path
        run: |
          echo "::error::The former self-hosted apply path was retired. Run seed013-hosted-encrypted-backup.yml first, retain its encrypted archive outside GitHub, then run seed013-hosted-protected-apply.yml."
          exit 1

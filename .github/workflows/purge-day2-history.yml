name: Purge approved Day 2 media from Git history
on:
  push:
    branches: [ops/purge-day2-media-history]
    paths:
      - scripts/purge-day2-history.py
      - scripts/test-purge-boundary.py
      - .github/workflows/purge-day2-history.yml
permissions:
  contents: write
concurrency:
  group: repository-day2-media-history-purge
  cancel-in-progress: false
jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install git-filter-repo==2.47.0
      - name: Verify purge scope and atomic push protection on an isolated repository
        run: python scripts/test-purge-boundary.py
      - name: Verify Blob copies, purge only target media, preserve code, and update refs with leases
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: PURGE-ONLY-DAY2-MEDIA-HISTORY
        run: python scripts/purge-day2-history.py

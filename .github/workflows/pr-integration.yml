name: PR integration CI

on:
  pull_request:
    branches:
      - main
      - feature/p2-business-operations
      - feature/ui-redesign
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-db-backup:
    name: PR verify database backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_backup_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test encrypted backup recovery and tamper rejection
        run: node --test test/backup-envelope.test.cjs
      - name: Test backup target safety
        run: node --test test/db-audit-backup.test.cjs
      # Keep the restore client on the same major as the PostgreSQL 16 CI
      # server, independent of the GitHub runner Ubuntu/apt repository version.
      - name: Prepare pinned PostgreSQL 16 client
        run: |
          docker pull postgres:16
          mkdir -p "$RUNNER_TEMP/pg16-bin"
          cat > "$RUNNER_TEMP/pg16-bin/pg16-client" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          command_name="$(basename "$0")"
          exec docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --volume /tmp:/tmp \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            -e PGCONNECT_TIMEOUT -e PGOPTIONS -e PGSSLMODE -e PGSSLROOTCERT \
            -e PGSSLCERT -e PGSSLKEY -e PGSSLPASSWORD \
            postgres:16 "$command_name" "$@"
          SH
          chmod +x "$RUNNER_TEMP/pg16-bin/pg16-client"
          ln -s pg16-client "$RUNNER_TEMP/pg16-bin/pg_dump"
          ln -s pg16-client "$RUNNER_TEMP/pg16-bin/pg_restore"
          echo "$RUNNER_TEMP/pg16-bin" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL client and service major versions
        run: |
          pg_dump --version
          pg_restore --version
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" = "16"
          test "$(pg_restore --version | grep -oE '[0-9]+' | head -1)" = "16"
          test "$(PGHOST=localhost PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=vomamxenang_backup_ci psql -XAt -c 'SHOW server_version_num' | cut -c1-2)" = "16"
      - name: Exercise backup and restore against PostgreSQL
        run: bash test/db-audit-backup.integration.sh

  verify-frontend:
    name: PR verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: node --test tests/*.test.cjs
      - run: yarn lint
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_ENV: production

  verify-backend:
    name: PR verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vomamxenang_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Validate PostgreSQL backup drill script
        run: bash -n scripts/self-managed-production-backup.sh
      - name: Validate Prisma schema
        run: yarn prisma validate
      - name: Typecheck backend
        run: yarn tsc --noEmit -p tsconfig.build.json
      - name: Apply migrations to fresh PostgreSQL
        run: yarn prisma:migrate
      - name: Audit fresh database against Prisma schema
        run: yarn prisma:migrate:drift-check
      - name: Run backend verification suite
        run: yarn test:ci
      - run: yarn build

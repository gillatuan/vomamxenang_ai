name: PR integration CI

on:
  pull_request:
    branches:
      - main
      - feature/p2-business-operations
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-frontend:
    name: PR verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: node --test tests/*.test.cjs
      - run: yarn lint
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_ENV: production

  verify-backend:
    name: PR verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vomamxenang_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Audit changed migration SQL for production safety
        shell: bash
        working-directory: .
        run: |
          mapfile -t migrations < <(git diff --name-only --diff-filter=AM "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'backend/prisma/migrations/*/migration.sql')
          node backend/scripts/audit-migration-safety.cjs "${migrations[@]}"
      - name: Validate Prisma schema
        run: yarn prisma validate
      - name: Typecheck backend
        run: yarn tsc --noEmit -p tsconfig.build.json
      - name: Apply migrations to fresh PostgreSQL
        run: yarn prisma:migrate
      - name: Audit fresh database against Prisma schema
        run: yarn prisma:migrate:drift-check
      - name: Run backend verification suite
        run: yarn test:ci
      - run: yarn build

name: PR integration CI

on:
  pull_request:
    branches:
      - main
      - feature/p2-business-operations
      - feature/ui-redesign
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-db-backup:
    name: PR verify database backup and restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_backup_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backup target safety
        run: node --test test/db-audit-backup.test.cjs
      - name: Install PostgreSQL client for restore test
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exercise backup and restore against PostgreSQL
        run: bash test/db-audit-backup.integration.sh

  verify-frontend:
    name: PR verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: node --test tests/*.test.cjs
      - run: yarn lint
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_ENV: production

  verify-backend:
    name: PR verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vomamxenang_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Validate PostgreSQL backup drill script
        run: bash -n scripts/self-managed-production-backup.sh
      - name: Validate Prisma schema
        run: yarn prisma validate
      - name: Typecheck backend
        run: yarn tsc --noEmit -p tsconfig.build.json
      - name: Apply migrations to fresh PostgreSQL
        run: yarn prisma:migrate
      - name: Audit fresh database against Prisma schema
        run: yarn prisma:migrate:drift-check
      - name: Run backend verification suite
        run: yarn test:ci
      - run: yarn build


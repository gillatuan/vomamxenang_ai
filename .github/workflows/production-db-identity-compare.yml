name: Compare Vercel and GitHub production DB identities (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-db-endpoint-compare-readonly
  cancel-in-progress: false

jobs:
  compare:
    name: Compare production DB schema fingerprints without writes
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      GITHUB_DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn prisma generate
      - name: Syntax-check safe comparison script
        run: node --check scripts/compare-production-db-identity.cjs
      - name: Fetch actual production public product catalog (read-only)
        working-directory: ${{ github.workspace }}
        env:
          BACKEND_PUBLIC_URL: https://vomamxenang-backend.vercel.app
        run: |
          set -euo pipefail
          npm install -g vercel@58.9.2 --silent
          vercel curl "$BACKEND_PUBLIC_URL/api/v1/products" -- --fail --silent --show-error \
            > "$RUNNER_TEMP/production-products.json"
          test -s "$RUNNER_TEMP/production-products.json"
      - name: Compare backend products to GitHub production DB
        env:
          PRODUCTION_PUBLIC_CATALOG_FILE: ${{ runner.temp }}/production-products.json
        run: node scripts/compare-production-db-identity.cjs
      - name: Explain safety and limits
        if: always()
        run: |
          {
            echo '### GitHub and Vercel production database identity'
            echo
            echo 'Compares live Vercel backend public product identifiers against GitHub Production DIRECT_DATABASE_URL.'
            echo 'No connection strings, credentials, hosts, or customer rows are logged.'
            echo 'PostgreSQL connection uses an explicitly READ ONLY transaction; backend uses a GET request.'
            echo 'Same public product identifiers do NOT prove physical database identity; clones can match.'
            echo 'Do not run Prisma migrate deploy or resolve until verified and authorized.'
          } >> "$GITHUB_STEP_SUMMARY"

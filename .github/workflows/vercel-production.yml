name: CI and deploy production

# CI/CD intentionally runs only after changes land on main.
# Feature branches and pull requests must not consume Vercel deployment quota.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/vercel-production.yml"

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-orchestration:
    name: Verify agent orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate task state
        shell: bash
        run: |
          shopt -s nullglob
          states=(.ai/tasks/TASK-*/state.json)
          if (( ${#states[@]} == 0 )); then
            echo "No task state files found"
            exit 1
          fi
          node .ai/orchestration/validate-state.cjs "${states[@]}"
      - name: Test task runner routing
        run: node .ai/orchestration/task-runner.test.cjs
      - name: Dry-run task dispatch plan
        run: node .ai/orchestration/task-runner.cjs
      - name: Test execution packet boundary
        run: node .ai/orchestration/execution-packet.test.cjs
      - name: Dry-run agent execution packet
        run: node .ai/orchestration/execution-packet.cjs .ai/tasks/TASK-0006/state.json
      - name: Test runtime adapter boundary
        run: node .ai/orchestration/runtime-adapter.test.cjs
      - name: Dry-run local agent runtime
        run: node .ai/orchestration/runtime-adapter.cjs .ai/tasks/TASK-0007/state.json local
      - name: Test external runtime policy
        run: node .ai/orchestration/external-runtime.test.cjs
      - name: Dry-run external runtime with mock provider
        run: node .ai/orchestration/external-runtime.cjs .ai/tasks/TASK-0008/state.json

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install
      - run: node --test tests/*.test.cjs
      - run: yarn lint
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn build
        env:
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_ENV: production

  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vomamxenang_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vomamxenang_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vomamxenang_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install
      - name: Validate Prisma schema
        run: yarn prisma validate
      - name: Typecheck backend
        run: yarn tsc --noEmit -p tsconfig.build.json
      - name: Apply test database migrations
        run: yarn prisma:migrate
      - name: Audit fresh database against Prisma schema
        run: yarn prisma:migrate:drift-check
      - name: Run backend verification suite
        run: yarn test:ci
      - run: yarn build

  deploy-production:
    name: Deploy production to Vercel
    needs: [verify-frontend, verify-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@58.9.2

      - name: Deploy backend
        id: deploy_backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        shell: bash
        run: |
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke backend deployment
        env:
          BACKEND_URL: ${{ steps.deploy_backend.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "$BACKEND_URL/api/v1/health/live" -- --fail --silent --show-error
          vercel curl "$BACKEND_URL/api/v1/health/ready" -- --fail --silent --show-error

      - name: Deploy frontend
        id: deploy_frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        shell: bash
        run: |
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke frontend deployment
        env:
          FRONTEND_URL: ${{ steps.deploy_frontend.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel curl "$FRONTEND_URL/" -- --fail --silent --show-error >/dev/null

      - name: Smoke public production API
        env:
          BACKEND_URL: ${{ steps.deploy_backend.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel curl "$BACKEND_URL/api/v1/store-info/public" -- --fail --silent --show-error >/dev/null
          vercel curl "$BACKEND_URL/api/v1/products" -- --fail --silent --show-error >/dev/null
